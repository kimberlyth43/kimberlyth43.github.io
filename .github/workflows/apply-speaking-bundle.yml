name: Apply speaking bundle
on:
  push:
    paths:
      - "speaking-bundle/**"
      - ".github/workflows/apply-speaking-bundle.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble, unpack, commit
        run: |
          set -euo pipefail
          if [ ! -d speaking-bundle ]; then echo "no bundle"; exit 0; fi
          cat speaking-bundle/chunk-* > /tmp/speaking-update.b64
          python3 - <<'PY'
          import base64, pathlib
          b64 = pathlib.Path("/tmp/speaking-update.b64").read_text().strip()
          pathlib.Path("/tmp/speaking-update.tar.gz").write_bytes(base64.b64decode(b64))
          print("decoded", pathlib.Path("/tmp/speaking-update.tar.gz").stat().st_size)
          PY
          tar -xzf /tmp/speaking-update.tar.gz -C .
          rm -rf speaking-bundle
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Speaking: transcript under video; manuscript headings in readings"
          git push
