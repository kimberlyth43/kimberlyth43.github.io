name: Apply speaking b64 parts
on:
  push:
    paths:
      - "speaking-bundle/**"
      - ".github/workflows/apply-speaking-b64.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode MANIFEST and commit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, pathlib
          root = pathlib.Path(".")
          bundle = root / "speaking-bundle"
          if not (bundle / "MANIFEST.json").exists():
              print("no manifest"); raise SystemExit(0)
          manifest = json.loads((bundle / "MANIFEST.json").read_text())
          for item in manifest:
              b64 = "".join((bundle / p).read_text().strip() for p in item["parts"])
              path = root / item["path"]
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(b64))
              print("wrote", item["path"], path.stat().st_size)
          PY
          rm -rf speaking-bundle
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Speaking: transcript under video; manuscript headings in readings"
          git push
