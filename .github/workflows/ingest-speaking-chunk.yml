name: Ingest speaking-deploy chunk
on:
  workflow_dispatch:
    inputs:
      name:
        description: filename under speaking-deploy/
        required: true
        type: string
      content:
        description: file contents
        required: true
        type: string
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write chunk
        env:
          NAME: ${{ inputs.name }}
          CONTENT: ${{ inputs.content }}
        run: |
          mkdir -p speaking-deploy
          printf '%s' "$CONTENT" > "speaking-deploy/$NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "speaking-deploy/$NAME"
          git commit -m "Speaking deploy ingest $NAME" || exit 0
          git push
