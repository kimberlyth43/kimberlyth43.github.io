name: Apply speaking-deploy
on:
  push:
    paths:
      - "speaking-deploy/**"
      - "speaking/talk-header.css"
      - ".github/workflows/apply-speaking-deploy.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Always apply header CSS + link injection
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          css_path = Path("style.css")
          if css_path.exists():
              css = css_path.read_text()
              css2 = css.replace(".art-head { padding: 22px 0 8px; }", ".art-head { padding: 28px 0 18px; }")
              old = "  .speaking-talk h1.art-title { margin-top: 0; }"
              new = "  .speaking-talk h1.art-title {\n    margin-top: 14px;\n    margin-bottom: 0;\n    line-height: 1.15;\n  }\n  .speaking-talk .art-byline { margin-top: 18px; }"
              if old in css2:
                  css2 = css2.replace(old, new)
              if css2 != css:
                  css_path.write_text(css2)
                  print("patched style.css")
              else:
                  print("style.css already patched or pattern missing")
          link = '<link rel="stylesheet" href="/speaking/talk-header.css">'
          for html in Path("speaking").rglob("*.html"):
              t = html.read_text()
              if "talk-header.css" in t:
                  continue
              needle = '<link rel="stylesheet" href="/style.css">'
              if needle in t:
                  html.write_text(t.replace(needle, needle + "\n" + link, 1))
                  print("linked", html)
          PY
      - name: Decode speaking-deploy and commit
        run: |
          set -euo pipefail
          if [[ ! -f speaking-deploy/PARTS.txt ]]; then
            echo "No PARTS.txt; CSS-only changes"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then echo "No changes"; exit 0; fi
            git commit -m "Speaking: apply talk-header CSS un-squash"
            git push
            exit 0
          fi
          python3 <<'PY'
          import base64, pathlib, tarfile, io, sys, binascii
          root = pathlib.Path(".")
          dep = root / "speaking-deploy"
          parts = [ln.strip() for ln in (dep / "PARTS.txt").read_text().splitlines() if ln.strip()]
          missing = [p for p in parts if not (dep / p).exists()]
          if missing:
              print("INCOMPLETE missing", len(missing), missing[:8])
              (dep / ".incomplete").write_text("\n".join(missing))
              sys.exit(0)
          raw = "".join((dep / p).read_text().strip() for p in parts)
          if parts[0].endswith(".hex"):
              data = binascii.unhexlify(raw.lower())
              print("decoded hex", len(data))
          else:
              data = base64.b64decode(raw)
              print("decoded b64", len(data))
          with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as tar:
              names = tar.getnames()
              tar.extractall(root)
              print("extracted", len(names))
          (dep / ".extract-ok").write_text("ok\n")
          PY
          if [[ -f speaking-deploy/.incomplete ]]; then
            echo "Incomplete parts; commit CSS if any"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add style.css speaking || true
            if git diff --cached --quiet; then echo "No CSS changes"; exit 0; fi
            git commit -m "Speaking: apply talk-header CSS (deploy still incomplete)"
            git push
            exit 0
          fi
          test -f speaking-deploy/.extract-ok
          rm -rf speaking-deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Speaking: Desiring God reading upgrade on preview"
          git push
