name: Fix readable transcripts
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fix_readable_transcripts.py"
      - ".github/workflows/fix-readable-transcripts.yml"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild readable transcripts
        run: python3 scripts/fix_readable_transcripts.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Speaking: clean readable transcripts without preview hacks"
          git push
